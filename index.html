<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VYCCHY DJ Mixer & Party Lights</title>
  <style>
    :root {
      --neon-pink: #ff007f;
      --neon-cyan: #00f3ff;
      --neon-purple: #9d00ff;
      --neon-green: #00ff66;
      --bg-dark: #07070e;
      --panel-bg: rgba(18, 18, 37, 0.85);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
      transition: background 0.1s ease;
      position: relative;
      overflow-x: hidden;
    }

    /* Animaciones de Luces Boliche */
    @keyframes party-strobe {
      0% { background-color: #07070e; box-shadow: inset 0 0 100px var(--neon-pink); }
      25% { background-color: #12001a; box-shadow: inset 0 0 150px var(--neon-cyan); }
      50% { background-color: #00121a; box-shadow: inset 0 0 100px var(--neon-green); }
      75% { background-color: #1a000c; box-shadow: inset 0 0 150px var(--neon-purple); }
      100% { background-color: #07070e; box-shadow: inset 0 0 100px var(--neon-pink); }
    }

    @keyframes flash-fast {
      0%, 100% { opacity: 1; filter: hue-rotate(0deg); }
      50% { opacity: 0.3; filter: hue-rotate(180deg); }
    }

    body.lights-active {
      animation: party-strobe 1.5s infinite alternate;
    }

    body.lights-fast {
      animation: party-strobe 0.4s infinite linear, flash-fast 0.2s infinite alternate;
    }

    h1 {
      font-size: 2.2rem;
      margin-bottom: 15px;
      text-transform: uppercase;
      letter-spacing: 3px;
      color: #fff;
      text-shadow: 0 0 10px var(--neon-cyan), 0 0 20px var(--neon-cyan);
    }

    .brand-logo {
      display: block;
      width: min(91px, 32vw);
      height: auto;
      margin: 0 auto 12px;
      object-fit: contain;
    }

    /* Master Controls & Lights Bar */
    .master-bar {
      width: 100%;
      max-width: 1100px;
      background: var(--panel-bg);
      border: 1px solid var(--neon-purple);
      border-radius: 12px;
      padding: 15px;
      margin-bottom: 20px;
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
      justify-content: space-around;
      align-items: center;
      backdrop-filter: blur(5px);
    }

    .master-group {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .mixer-container {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      justify-content: center;
      max-width: 1100px;
      width: 100%;
    }

    .deck {
      background: var(--panel-bg);
      border: 2px solid var(--neon-purple);
      border-radius: 15px;
      padding: 15px;
      flex: 1;
      min-width: 320px;
      backdrop-filter: blur(5px);
    }

    .deck-a { border-color: var(--neon-cyan); box-shadow: 0 0 15px rgba(0, 243, 255, 0.2); }
    .deck-b { border-color: var(--neon-pink); box-shadow: 0 0 15px rgba(255, 0, 127, 0.2); }

    .playlist-panel {
      width: 100%;
      max-width: 1100px;
      margin: 0 0 20px;
      padding: 15px;
      border: 1px solid var(--neon-green);
      border-radius: 12px;
      background: var(--panel-bg);
    }

    .playlist-panel h2 {
      margin-bottom: 10px;
      color: var(--neon-green);
      font-size: 1rem;
      letter-spacing: 1px;
    }

    .deck-layout { grid-template-columns: minmax(0, 1fr) 190px; }

    .deck-playlist {
      min-width: 0;
      padding-left: 12px;
      border-left: 1px solid #333;
    }

    .deck-playlist summary {
      color: var(--neon-green);
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: bold;
      letter-spacing: 1px;
    }

    .deck-playlist .playlist-list {
      display: flex;
      flex-direction: column;
      max-height: 390px;
      margin-top: 10px;
    }

    .deck-playlist .playlist-item { display: block; }
    .deck-playlist .playlist-button { width: 100%; margin-top: 5px; }

    .playlist-list {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 8px;
      max-height: 260px;
      overflow-y: auto;
    }

    .playlist-item {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto auto;
      gap: 8px;
      align-items: center;
      padding: 8px;
      border: 1px solid #333;
      border-radius: 5px;
      background: #0d0d1c;
    }

    .playlist-title { overflow-wrap: anywhere; font-size: 0.85rem; }
    .playlist-button { padding: 6px 8px; font-size: 0.72rem; }

    .deck-layout {
      display: grid;
      grid-template-columns: 1fr;
      gap: 15px;
    }

    .deck-history {
      min-width: 0;
      padding-left: 12px;
      border-left: 1px solid #333;
    }

    .deck-history h3 {
      margin-bottom: 10px;
      color: var(--neon-green);
      font-size: 0.85rem;
      letter-spacing: 1px;
    }

    .history-list {
      display: flex;
      flex-direction: column;
      gap: 7px;
      max-height: 390px;
      overflow-y: auto;
    }

    .history-empty {
      color: #aaa;
      font-size: 0.78rem;
    }

    .history-item {
      width: 100%;
      padding: 8px;
      border: 1px solid #333;
      border-radius: 5px;
      background: #0d0d1c;
      color: #fff;
      text-align: left;
      cursor: pointer;
    }

    .history-item:hover { border-color: var(--neon-green); }
    .history-item img { width: 100%; aspect-ratio: 16 / 9; object-fit: cover; margin-bottom: 5px; }
    .history-item span { display: block; font-size: 0.76rem; line-height: 1.25; }

    :focus-visible {
      outline: 3px solid #fff;
      outline-offset: 3px;
      box-shadow: 0 0 0 6px rgba(0, 243, 255, 0.55);
      position: relative;
      z-index: 2;
    }

    button, summary, input, select { scroll-margin: 16px; }

    @media (min-width: 900px) and (min-height: 650px) {
      body { padding: 12px 24px; }
      h1 { font-size: 1.8rem; margin-bottom: 8px; }
      .brand-logo { width: 64px; margin-bottom: 6px; }
      .master-bar, .playlist-panel, .mixer-container, .crossfader-panel { max-width: 1100px; }
      .master-bar { padding: 10px 14px; margin-bottom: 12px; gap: 10px; }
      .playlist-panel { padding: 10px 14px; margin-bottom: 12px; }
      .mixer-container { gap: 12px; }
      .deck { padding: 12px; }
      .deck-layout { grid-template-columns: minmax(0, 1fr) minmax(190px, 0.62fr); gap: 12px; }
      .deck-playlist { padding-left: 10px; }
      .deck-playlist .playlist-list { max-height: 28vh; }
      .video-wrapper { margin-bottom: 10px; }
      .controls { margin-bottom: 10px; }
      .crossfader-panel { padding: 12px 18px; margin-top: 12px; }
    }

    @media (min-width: 900px) and (min-height: 801px) {
      body { justify-content: center; padding: 8px 16px; }
      h1 { font-size: 1.35rem; margin-bottom: 4px; }
      .brand-logo { width: 48px; margin-bottom: 2px; }
      .master-bar, .playlist-panel, .mixer-container, .crossfader-panel { max-width: 720px; }
      .master-bar { padding: 6px 10px; margin-bottom: 6px; gap: 6px; }
      .playlist-panel { padding: 6px 10px; margin-bottom: 6px; }
      .mixer-container { gap: 8px; }
      .deck { padding: 8px; }
      .deck-layout { grid-template-columns: minmax(0, 1fr) minmax(130px, 0.6fr); gap: 8px; }
      .deck-playlist { padding-left: 6px; }
      .deck-playlist .playlist-list { max-height: 22vh; }
      .video-wrapper, .controls { margin-bottom: 6px; }
      .crossfader-panel { padding: 6px 10px; margin-top: 6px; }
      .btn, .speed-select { font-size: 0.8rem; }
    }

    @media (min-width: 900px) and (max-height: 800px) {
      body {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 425px));
        align-content: center;
        align-items: stretch;
        justify-content: center;
        gap: 8px 12px;
        padding-bottom: 0;
      }
      body { padding-top: 8px; }
      .brand-logo { position: absolute; top: 8px; left: 24px; width: 44px; margin: 0; }
      h1 { grid-column: 1 / -1; font-size: 1.45rem; margin: 2px 0 0; text-align: center; }
      .master-bar { grid-column: 1; max-width: none; flex-wrap: wrap; justify-content: center; padding: 6px; margin: 0; gap: 6px; }
      .master-group { flex-wrap: wrap; justify-content: center; gap: 4px; white-space: nowrap; font-size: 0.75rem; }
      .master-bar .btn { padding: 6px 8px; font-size: 0.7rem; }
      .playlist-panel { grid-column: 2; max-width: none; padding: 4px; margin: 0; }
      .playlist-panel h2 { margin-bottom: 2px; }
      .playlist-panel .search-row { margin-bottom: 2px; }
      .playlist-panel .url-input { padding: 6px; }
      .playlist-panel .btn { padding: 6px 8px; font-size: 0.7rem; }
      .mixer-container, .crossfader-panel { grid-column: 1 / -1; max-width: 850px; }
      .mixer-container { gap: 8px; }
      .deck { padding: 10px; }
      .video-wrapper, .controls { margin-bottom: 8px; }
      .vol-control input[type=range] { flex: 1; min-width: 0; width: auto; }
      .crossfader-panel { padding: 4px 8px; margin: 0; }
      .crossfader-panel > div:first-child { margin-bottom: 4px !important; }
      .crossfader-container { gap: 10px; }
      .crossfader-container input[type=range] { flex: 1; min-width: 120px; width: auto; }
    }

    @media (max-width: 720px) {
      body { padding: 12px; }
      h1 { font-size: 1.55rem; letter-spacing: 1px; text-align: center; }
      .master-group { flex-wrap: wrap; justify-content: center; }
      .master-bar { gap: 12px; }
      .deck { min-width: 0; width: 100%; }
      .deck-playlist { padding: 12px 0 0; border-left: 0; border-top: 1px solid #333; }
      .deck-layout { grid-template-columns: 1fr; }
      .history-list { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); max-height: 260px; }
      .crossfader-container { flex-wrap: wrap; justify-content: center; }
      .crossfader-container input[type=range] { flex: 1 1 100%; order: 1; }
    }

    .video-wrapper {
      position: relative;
      width: 100%;
      padding-bottom: 56.25%;
      height: 0;
      border-radius: 10px;
      overflow: hidden;
      margin-bottom: 15px;
      background: #000;
    }

    .video-wrapper iframe {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
    }

    .url-input {
      width: 100%;
      padding: 10px;
      margin-bottom: 10px;
      background: #121225;
      border: 1px solid var(--neon-purple);
      border-radius: 5px;
      color: #fff;
      outline: none;
    }

    [data-remote-highlight] {
      outline: 3px solid #fff;
      outline-offset: 3px;
      box-shadow: 0 0 0 6px rgba(0, 243, 255, 0.55);
      position: relative;
      z-index: 2;
    }

    .search-row {
      display: flex;
      gap: 8px;
      margin-bottom: 10px;
    }

    .search-row .url-input {
      margin-bottom: 0;
    }

    .search-btn {
      flex: 0 0 auto;
      white-space: nowrap;
    }

    .search-results {
      display: none;
      position: fixed;
      z-index: 20;
      top: 8vh;
      left: 50%;
      transform: translateX(-50%);
      width: min(680px, calc(100vw - 30px));
      max-height: 84vh;
      overflow-y: auto;
      border: 2px solid var(--neon-cyan);
      border-radius: 10px;
      background: #0d0d1c;
      box-shadow: 0 0 35px rgba(0, 243, 255, 0.35);
    }

    .search-results.visible { display: block; }

    .search-result {
      width: 100%;
      display: flex;
      gap: 10px;
      align-items: center;
      padding: 8px;
      border: 0;
      border-bottom: 1px solid #292943;
      background: transparent;
      color: #fff;
      text-align: left;
      cursor: pointer;
    }

    .search-result:last-child { border-bottom: 0; }
    .search-result:hover { background: #1b1b35; }
    .search-result img { width: 80px; height: 45px; object-fit: cover; }
    .search-result span { font-size: 0.85rem; }

    .search-modal-header {
      position: sticky;
      top: 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px;
      background: #15152b;
      border-bottom: 1px solid #333;
      font-weight: bold;
    }

    .search-modal-close {
      border: 0;
      background: transparent;
      color: #fff;
      font-size: 1.3rem;
      cursor: pointer;
    }

    .controls {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
    }

    .btn {
      padding: 10px 15px;
      border: none;
      border-radius: 5px;
      font-weight: bold;
      cursor: pointer;
      text-transform: uppercase;
      transition: all 0.2s;
    }

    .btn-a { background: var(--neon-cyan); color: #000; }
    .btn-b { background: var(--neon-pink); color: #fff; }
    .btn-master { background: var(--neon-green); color: #000; box-shadow: 0 0 10px var(--neon-green); }
    .btn-lights { background: var(--neon-purple); color: #fff; box-shadow: 0 0 10px var(--neon-purple); }

    .btn:hover { opacity: 0.85; transform: scale(1.03); }

    .vol-control {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    /* Crossfader Section */
    .crossfader-panel {
      width: 100%;
      max-width: 1100px;
      background: var(--panel-bg);
      border: 2px solid #333;
      border-radius: 15px;
      padding: 20px;
      margin-top: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .crossfader-container {
      display: flex;
      align-items: center;
      width: 100%;
      gap: 15px;
    }

    .auto-crossfader-btn {
      min-width: 74px;
      padding: 8px 10px;
      border: 1px solid var(--neon-green);
      border-radius: 5px;
      background: transparent;
      color: var(--neon-green);
      font-weight: bold;
      cursor: pointer;
    }

    .auto-crossfader-btn.active {
      background: var(--neon-green);
      color: #000;
      box-shadow: 0 0 12px var(--neon-green);
    }

    .speed-select {
      padding: 8px;
      border: 1px solid var(--neon-purple);
      border-radius: 5px;
      background: #121225;
      color: #fff;
      font-weight: bold;
    }

    input[type=range] {
      -webkit-appearance: none;
      width: 100%;
      background: transparent;
    }

    input[type=range]:focus { outline: 3px solid #fff; outline-offset: 4px; }

    input[type=range]::-webkit-slider-runnable-track {
      width: 100%;
      height: 12px;
      cursor: pointer;
      background: linear-gradient(90deg, var(--neon-cyan) 0%, var(--neon-purple) 50%, var(--neon-pink) 100%);
      border-radius: 6px;
    }

    input[type=range]::-webkit-slider-thumb {
      height: 26px;
      width: 16px;
      border-radius: 4px;
      background: #fff;
      cursor: pointer;
      -webkit-appearance: none;
      margin-top: -7px;
      box-shadow: 0 0 10px #fff;
    }

    @media (min-width: 900px) and (min-height: 801px) {
      .crossfader-panel { max-width: 720px; padding: 6px 10px; margin-top: 6px; }
    }

    @media (min-width: 900px) and (max-height: 800px) {
      .mixer-container, .crossfader-panel { justify-self: center; }
      .crossfader-panel { max-width: 850px; padding: 4px 8px; margin: 0; }
    }

    @media (min-width: 560px) and (max-width: 720px) and (max-height: 700px) {
      body {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        align-content: center;
        align-items: stretch;
        gap: 4px 8px;
        min-height: 100vh;
        padding: 4px;
      }
      .brand-logo { position: absolute; top: 4px; left: 8px; width: 28px; margin: 0; }
      h1 { grid-column: 1 / -1; font-size: 1rem; margin: 0; letter-spacing: 0; text-align: center; }
      .master-bar, .playlist-panel { width: 100%; max-width: none; margin: 0; padding: 4px; border-radius: 6px; }
      .master-bar { grid-column: 1; flex-wrap: wrap; justify-content: center; gap: 2px; }
      .master-group { flex-wrap: nowrap; gap: 3px; font-size: 0.6rem; }
      .master-bar .btn, .playlist-panel .btn { padding: 4px; font-size: 0.6rem; }
      .playlist-panel { grid-column: 2; }
      .playlist-panel h2 { margin-bottom: 2px; font-size: 0.65rem; letter-spacing: 0; }
      .playlist-panel .search-row { gap: 3px; margin-bottom: 0; }
      .playlist-panel .url-input { min-width: 0; padding: 4px; margin: 0; font-size: 0.65rem; }
      .mixer-container {
        grid-column: 1 / -1;
        justify-self: center;
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 4px;
        width: 100%;
        max-width: 520px;
      }
      .deck { min-width: 0; width: auto; padding: 6px; border-radius: 8px; }
      .deck-layout { grid-template-columns: 1fr; gap: 4px; }
      .deck-layout > div:first-child { min-width: 0; }
      .deck .search-row { gap: 3px; margin-bottom: 4px; }
      .deck .url-input { min-width: 0; padding: 4px; margin-bottom: 4px; font-size: 0.65rem; }
      .deck .btn { padding: 4px; font-size: 0.6rem; }
      .deck .video-wrapper { margin-bottom: 4px; }
      .deck .controls { gap: 4px; margin-bottom: 4px; }
      .vol-control { gap: 4px; font-size: 0.65rem; }
      .vol-control input[type=range] { min-width: 0; }
      .vol-control input[type=range]::-webkit-slider-runnable-track { height: 7px; }
      .vol-control input[type=range]::-webkit-slider-thumb { width: 10px; height: 16px; margin-top: -5px; }
      .deck-playlist { min-width: 0; padding: 4px 0 0; border-left: 0; border-top: 1px solid #333; }
      .deck-playlist summary { font-size: 0.6rem; }
      .deck-playlist .playlist-list { max-height: 42px; margin-top: 3px; }
      .deck-playlist .playlist-item { padding: 3px; }
      .deck-playlist .playlist-title { font-size: 0.6rem; }
      .deck-playlist .playlist-button { margin-top: 2px; }
      .crossfader-panel {
        grid-column: 1 / -1;
        justify-self: center;
        width: 100%;
        max-width: 520px;
        padding: 4px;
        margin: 0;
        border-radius: 8px;
      }
      .crossfader-panel > div:first-child { margin-bottom: 2px !important; font-size: 0.65rem; letter-spacing: 0; }
      .crossfader-container { flex-wrap: nowrap; gap: 4px; }
      .crossfader-container > span { font-size: 0.6rem; }
      .crossfader-container input[type=range] { flex: 1; min-width: 70px; width: auto; }
      .auto-crossfader-btn { min-width: 48px; padding: 4px; font-size: 0.6rem; }
      .speed-select { padding: 4px; font-size: 0.6rem; }
    }
  </style>
</head>
<body>

  <img class="brand-logo" src="logo.jpeg" alt="Logo VYCCHY">
  <h1>VYCCHY DJ Mixer</h1>

  <div class="master-bar">
    <div class="master-group">
      <span style="font-weight:bold; color: var(--neon-green);">GLOBAL:</span>
      <button class="btn btn-master" onclick="playBoth()">► Play Ambos</button>
      <button class="btn btn-master" onclick="pauseBoth()">❚❚ Pause Ambos</button>
    </div>

    <div class="master-group">
      <span style="font-weight:bold; color: var(--neon-purple);">LUCES BOLICHE:</span>
      <button class="btn btn-lights" onclick="setLights('off')">Off</button>
      <button class="btn btn-lights" onclick="setLights('smooth')">Suave</button>
      <button class="btn btn-lights" onclick="setLights('fast')">Fiesta 🔥</button>
    </div>
  </div>

  <section class="playlist-panel" aria-label="Lista de videos">
    <h2>BUSCAR Y GUARDAR VIDEO</h2>
    <div class="search-row">
      <input type="search" id="search-playlist" class="url-input" placeholder="Buscar artista, canción o enlace" onkeydown="if (event.key === 'Enter') searchYouTubeMusic('playlist')">
      <button class="btn btn-master search-btn" onclick="searchYouTubeMusic('playlist')">Buscar</button>
    </div>
    <div id="sheet-status" class="history-empty" aria-live="polite"></div>
    <div id="results-playlist" class="search-results" aria-live="polite"></div>
  </section>

  <div class="mixer-container">
    <div class="deck deck-a">
      <div class="deck-layout">
        <div>
      <div class="search-row">
        <input type="search" id="search-a" class="url-input" placeholder="Buscar videos o pegar enlace" onkeydown="if (event.key === 'Enter') searchYouTubeMusic('a')">
        <button class="btn btn-a search-btn" onclick="searchYouTubeMusic('a')" title="Buscar dentro de este deck">Buscar</button>
      </div>
      <div id="results-a" class="search-results" aria-live="polite"></div>
      <input type="text" id="url-a" class="url-input" placeholder="URL o ID de YouTube A" value="L_LUpnjgPso">
      <button class="btn btn-a" style="width: 100%; margin-bottom: 10px;" onclick="loadVideo('a')">Cargar Deck A</button>
      <div class="video-wrapper">
        <div id="player-a"></div>
      </div>
      <div class="controls">
        <button class="btn btn-a" style="flex:1;" onclick="playVideo('a')">Play</button>
        <button class="btn btn-a" style="flex:1;" onclick="pauseVideo('a')">Pause</button>
      </div>
      <div class="vol-control">
        <span>Vol A:</span>
        <input type="range" id="vol-a" min="0" max="100" value="100" oninput="setIndividualVolume('a', this.value)">
        <span id="vol-display-a" style="width: 40px;">100%</span>
      </div>
        </div>
        <details class="deck-playlist" open>
          <summary>LISTA DECK 1</summary>
          <div id="playlist-a" class="playlist-list"><span class="history-empty">Sin videos</span></div>
        </details>
      </div>
    </div>

    <div class="deck deck-b">
      <div class="deck-layout">
        <div>
      <div class="search-row">
        <input type="search" id="search-b" class="url-input" placeholder="Buscar videos o pegar enlace" onkeydown="if (event.key === 'Enter') searchYouTubeMusic('b')">
        <button class="btn btn-b search-btn" onclick="searchYouTubeMusic('b')" title="Buscar dentro de este deck">Buscar</button>
      </div>
      <div id="results-b" class="search-results" aria-live="polite"></div>
      <input type="text" id="url-b" class="url-input" placeholder="URL o ID de YouTube B" value="L_LUpnjgPso">
      <button class="btn btn-b" style="width: 100%; margin-bottom: 10px;" onclick="loadVideo('b')">Cargar Deck B</button>
      <div class="video-wrapper">
        <div id="player-b"></div>
      </div>
      <div class="controls">
        <button class="btn btn-b" style="flex:1;" onclick="playVideo('b')">Play</button>
        <button class="btn btn-b" style="flex:1;" onclick="pauseVideo('b')">Pause</button>
      </div>
      <div class="vol-control">
        <span>Vol B:</span>
        <input type="range" id="vol-b" min="0" max="100" value="100" oninput="setIndividualVolume('b', this.value)">
        <span id="vol-display-b" style="width: 40px;">100%</span>
      </div>
        </div>
        <details class="deck-playlist" open>
          <summary>LISTA DECK 2</summary>
          <div id="playlist-b" class="playlist-list"><span class="history-empty">Sin videos</span></div>
        </details>
      </div>
    </div>
  </div>

  <div class="crossfader-panel">
    <div style="margin-bottom: 10px; font-weight: bold; letter-spacing: 2px;">CROSSFADER (MEZCLA DE AUDIO)</div>
    <div class="crossfader-container">
      <span style="color: var(--neon-cyan); font-weight: bold;">DECK A</span>
      <input type="range" id="crossfader" min="0" max="100" value="50" oninput="stopAutoCrossfader(); applyVolumes()">
      <button id="auto-crossfader" class="auto-crossfader-btn" onclick="toggleAutoCrossfader()" aria-pressed="false">AUTO</button>
      <select id="crossfader-speed" class="speed-select" aria-label="Velocidad automática">
        <option value="slow">Lenta</option>
        <option value="normal" selected>Normal</option>
        <option value="fast">Rápida</option>
      </select>
      <span style="color: var(--neon-pink); font-weight: bold;">DECK B</span>
    </div>
  </div>

  <script>
    let playerA, playerB;
    let masterVolA = 100;
    let masterVolB = 100;
    let autoCrossfaderTimer = null;
    let autoCrossfaderActive = false;
    let autoCrossfaderDirection = 1;
    const playlistHistory = [];
    let pendingVideo = null;
    let remoteFocusTarget = null;
    let historyReady = false;
    const cacheDatabase = openCacheDatabase();
    const configuredApiUrl = new URLSearchParams(window.location.search).get('api');
    const sheetApiUrl = new URLSearchParams(window.location.search).get('sheetApi') || localStorage.getItem('vycchy-sheet-api') || 'https://script.google.com/macros/s/AKfycbyrtzfN1c7h2nA7PxgOcrTIkdUmLTiwbtmnacfrS9KWjr4NLsmhTxKpkfrBFV-94eEr/exec';
    const searchApiUrl = configuredApiUrl || localStorage.getItem('vycchy-search-api') || sheetApiUrl;
    const playerOrigin = /^https?:$/.test(window.location.protocol) ? window.location.origin : '';
    const crossfaderSpeeds = {
      slow: { interval: 100, step: 1 },
      normal: { interval: 60, step: 2 },
      fast: { interval: 30, step: 4 }
    };

    // API YouTube
    const tag = document.createElement('script');
    tag.src = "https://www.youtube.com/iframe_api";
    document.getElementsByTagName('script')[0].parentNode.insertBefore(tag, document.getElementsByTagName('script')[0]);

    async function onYouTubeIframeAPIReady() {
      await restoreHistory();
      await restoreSheetHistory();
      const playerVars = getPlayerVars();
      playerA = new YT.Player('player-a', { videoId: 'L_LUpnjgPso', playerVars });
      playerB = new YT.Player('player-b', { videoId: 'L_LUpnjgPso', playerVars });
      historyReady = true;
      if (!playlistHistory.length) addToHistory('L_LUpnjgPso', 'Fireplace Ambience', false);
    }

    function getPlayerVars() {
      const playerVars = { controls: 1, enablejsapi: 1, playsinline: 1 };
      if (playerOrigin) {
        playerVars.origin = playerOrigin;
        playerVars.widget_referrer = window.location.href;
      }
      return playerVars;
    }

    function openCacheDatabase() {
      return new Promise((resolve, reject) => {
        const request = indexedDB.open('vycchy-dj-cache', 1);
        request.onupgradeneeded = () => {
          const database = request.result;
          database.createObjectStore('history', { keyPath: 'key' });
          database.createObjectStore('searches', { keyPath: 'query' });
        };
        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error);
      });
    }

    async function readCache(storeName, key) {
      try {
        const database = await cacheDatabase;
        return await new Promise((resolve, reject) => {
          const request = database.transaction(storeName, 'readonly').objectStore(storeName).get(key);
          request.onsuccess = () => resolve(request.result);
          request.onerror = () => reject(request.error);
        });
      } catch (error) {
        return null;
      }
    }

    async function writeCache(storeName, value) {
      try {
        const database = await cacheDatabase;
        database.transaction(storeName, 'readwrite').objectStore(storeName).put(value);
      } catch (error) {
        // El almacenamiento es opcional; no debe bloquear la reproducción.
      }
    }

    async function restoreHistory() {
      const saved = await readCache('history', 'playlist');
      if (saved?.items) playlistHistory.push(...saved.items);
      renderPlaylist();
    }

    async function restoreSheetHistory() {
      if (!sheetApiUrl) return;
      try {
        const response = await fetch(sheetApiUrl);
        if (!response.ok) return;
        const data = await response.json();
        mergeSheetHistory(data.items || []);
        renderPlaylist();
      } catch (error) {
        // La app continúa usando la caché local si la hoja no está disponible.
      }
    }

    function mergeSheetHistory(items) {
      items.slice().reverse().forEach(item => {
        const videoUrl = item.url || item.id || '';
        const videoId = extractVideoId(videoUrl);
        if (!/^[A-Za-z0-9_-]{11}$/.test(videoId) || playlistHistory.some(existing => existing.videoId === videoId)) return;
        playlistHistory.push({ videoId, url: videoUrl, title: escapeHtml(item.title || videoId) });
      });
      playlistHistory.splice(12);
    }

    async function saveToSheet(videoId, title) {
      const status = document.getElementById('sheet-status');
      if (!sheetApiUrl) {
        status.textContent = 'La hoja no está conectada: falta la URL de Apps Script.';
        return false;
      }
      try {
        const response = await fetch(sheetApiUrl, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ url: `https://www.youtube.com/watch?v=${videoId}`, title })
        });
        if (!response.ok) throw new Error('Respuesta no válida');
        status.textContent = 'Guardado en Google Sheets.';
        return true;
      } catch (error) {
        status.textContent = 'No se pudo guardar en Google Sheets. Revisa la URL de Apps Script.';
        return false;
      }
    }

    function extractVideoId(input) {
      const normalizedInput = input.replace('yout-ube.com', 'youtube.com');
      const match = normalizedInput.match(/^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/);
      return (match && match[2].length === 11) ? match[2] : normalizedInput;
    }

    async function searchYouTubeMusic(deck) {
      const query = document.getElementById(`search-${deck}`).value.trim();
      const results = document.getElementById(`results-${deck}`);
      if (!query) return;

      const videoId = extractVideoId(query);
      if (videoId && /^[A-Za-z0-9_-]{11}$/.test(videoId)) {
        renderSearchResults(deck, { directVideo: { videoId } });
        return;
      }

      results.classList.add('visible');
      results.innerHTML = `<div class="search-modal-header"><span>Buscando videos</span><button class="search-modal-close" onclick="closeSearchResults('${deck}')" aria-label="Cerrar resultados">&times;</button></div><div style="padding: 10px;">Buscando...</div>`;
      try {
        const response = await fetch(`${searchApiUrl}?q=${encodeURIComponent(query)}`);
        if (!response.ok) throw new Error('No se pudo buscar');
        const data = await response.json();
        writeCache('searches', { query, data, savedAt: Date.now() });
        renderSearchResults(deck, data);
      } catch (error) {
        const cached = await readCache('searches', query);
        if (cached?.data) renderSearchResults(deck, cached.data);
        else results.innerHTML = `<div class="search-modal-header"><span>Sin resultados</span><button class="search-modal-close" onclick="closeSearchResults('${deck}')">&times;</button></div><div style="padding: 10px;">No se pudo buscar. Puedes pegar un enlace directo.</div>`;
      }
    }

    function renderSearchResults(deck, data) {
      const results = document.getElementById(`results-${deck}`);
      if (data.directVideo) {
        results.classList.add('visible');
        results.innerHTML = `<div class="search-modal-header"><span>Video encontrado</span><button class="search-modal-close" onclick="closeSearchResults('${deck}')">&times;</button></div><button class="search-result" onclick="selectSearchResult('${data.directVideo.videoId}', '${deck}', 'Video seleccionado')"><span>Guardar video ${data.directVideo.videoId}</span></button>`;
        results.querySelector('.search-result')?.focus();
        return;
      }
      const items = data.contents?.twoColumnSearchResultsRenderer?.primaryContents
        ?.sectionListRenderer?.contents?.flatMap(section => section.itemSectionRenderer?.contents || []) || [];
      const videos = items.map(item => item.videoRenderer).filter(Boolean).slice(0, 8);
      if (!videos.length) {
        results.innerHTML = `<div class="search-modal-header"><span>Resultados</span><button class="search-modal-close" onclick="closeSearchResults('${deck}')" aria-label="Cerrar resultados">&times;</button></div><div style="padding: 10px;">No se encontraron videos.</div>`;
        return;
      }

      results.innerHTML = `<div class="search-modal-header"><span>Selecciona un video para Deck ${deck.toUpperCase()}</span><button class="search-modal-close" onclick="closeSearchResults('${deck}')" aria-label="Cerrar resultados">&times;</button></div>` + videos.map(video => {
        const title = video.title?.runs?.[0]?.text || 'Video sin título';
        const videoId = video.videoId;
        const thumbnail = video.thumbnail?.thumbnails?.[0]?.url || '';
        return `<button class="search-result" onclick="selectSearchResult('${videoId}', '${deck}', this.querySelector('span').textContent)">
          <img src="${thumbnail}" alt="">
          <span>${escapeHtml(title)}</span>
        </button>`;
      }).join('');
      results.querySelector('.search-result')?.focus();
    }

    function selectSearchResult(videoId, deck, title = 'Video seleccionado') {
      pendingVideo = { videoId, deck, title };
      const results = document.getElementById(`results-${deck}`);
      results.classList.add('visible');
      results.innerHTML = `<div class="search-modal-header"><span>Guardar video</span><button class="search-modal-close" onclick="closeSearchResults('${deck}')">&times;</button></div>
        <div style="padding: 12px;">
          <div style="margin-bottom: 8px;">${escapeHtml(title)}</div>
          <input id="pending-title" class="url-input" type="text" placeholder="Nombre de la canción o tema" value="${escapeHtml(title)}">
          <button class="btn btn-master" onclick="savePendingVideo()">Guardar en la lista</button>
        </div>`;
      document.getElementById('pending-title').focus();
    }

    async function savePendingVideo() {
      if (!pendingVideo) return;
      const titleInput = document.getElementById('pending-title');
      const title = titleInput.value.trim();
      if (!title) {
        titleInput.focus();
        return;
      }
      const { videoId, deck } = pendingVideo;
      const videoUrl = `https://www.youtube.com/watch?v=${videoId}`;
      const saved = await saveToSheet(videoId, title);
      if (!saved) return;
      addToHistory(videoId, title, true, videoUrl);
      if (deck === 'playlist') {
        document.getElementById('url-a').value = videoUrl;
        loadVideo('a', videoId, title);
      } else {
        document.getElementById(`url-${deck}`).value = videoUrl;
        loadVideo(deck, videoId, title);
      }
      pendingVideo = null;
      document.getElementById(`results-${deck}`).classList.remove('visible');
    }

    function closeSearchResults(deck) {
      pendingVideo = null;
      document.getElementById(`results-${deck}`).classList.remove('visible');
    }

    function escapeHtml(value) {
      return value.replace(/[&<>'"]/g, character => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
      }[character]));
    }

    function loadVideo(deck, selectedVideoId = '', title = '') {
      const videoId = selectedVideoId || extractVideoId(document.getElementById(`url-${deck}`).value);
      const player = deck === 'a' ? playerA : playerB;
      if (!videoId || !/^[A-Za-z0-9_-]{11}$/.test(videoId)) return;
      addToHistory(videoId, title || document.getElementById(`url-${deck}`).value);

      if (!window.YT || !YT.Player) {
        loadVideoFallback(deck, videoId);
        return;
      }

        if (player && player.loadVideoById) {
          player.loadVideoById(videoId);
          return;
        }

      const newPlayer = new YT.Player(`player-${deck}`, {
        videoId,
        playerVars: getPlayerVars(),
        events: {
          onReady: event => {
            event.target.mute();
            event.target.playVideo();
          },
          onError: event => handlePlayerError(deck, videoId, event.data)
        }
      });
      if (deck === 'a') playerA = newPlayer;
      else playerB = newPlayer;
    }

    function loadVideoFallback(deck, videoId) {
      const playerContainer = document.getElementById(`player-${deck}`);
      if (deck === 'a') playerA = null;
      else playerB = null;
        const referrer = playerOrigin ? `&origin=${encodeURIComponent(playerOrigin)}` : '';
        playerContainer.innerHTML = `<iframe src="https://www.youtube.com/embed/${videoId}?autoplay=0&controls=1&playsinline=1${referrer}" title="Reproductor de video" referrerpolicy="strict-origin-when-cross-origin" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>`;
    }

    function handlePlayerError(deck, videoId, errorCode) {
      if ([5, 153].includes(Number(errorCode))) {
        loadVideoFallback(deck, videoId);
        return;
      }
      showUnavailableVideo(deck, videoId);
    }

    function addToHistory(videoId, title, persist = true, url = `https://www.youtube.com/watch?v=${videoId}`) {
      if (playlistHistory.some(item => item.videoId === videoId)) return;
      playlistHistory.unshift({ videoId, url, title: escapeHtml(title) });
      playlistHistory.splice(12);
      renderPlaylist();
      if (historyReady) writeCache('history', { key: 'playlist', items: playlistHistory });
    }

    function renderPlaylist() {
      if (!playlistHistory.length) {
        ['a', 'b'].forEach(deck => {
          document.getElementById(`playlist-${deck}`).innerHTML = '<span class="history-empty">Sin videos</span>';
        });
        return;
      }
      ['a', 'b'].forEach(deck => {
        document.getElementById(`playlist-${deck}`).innerHTML = playlistHistory.map(item => `<div class="playlist-item">
          <span class="playlist-title">${item.title}</span>
          <button class="btn ${deck === 'a' ? 'btn-a' : 'btn-b'} playlist-button" onclick="loadPlaylistItem('${item.videoId}', '${deck}')">Reproducir</button>
        </div>`).join('');
      });
    }

    function loadPlaylistItem(videoId, deck) {
      const item = playlistHistory.find(historyItem => historyItem.videoId === videoId);
      const title = item?.title || 'Video del historial';
      const videoUrl = item?.url || `https://www.youtube.com/watch?v=${videoId}`;
      document.getElementById(`url-${deck}`).value = videoUrl;
      loadVideo(deck, extractVideoId(videoUrl), title);
    }

    function showUnavailableVideo(deck, videoId) {
      const results = document.getElementById(`results-${deck}`);
      results.classList.add('visible');
      results.insertAdjacentHTML('afterbegin', `<div style="padding: 10px; color: #ff8abf;">Este video no permite reproducción incrustada. <a href="https://www.youtube.com/watch?v=${videoId}" target="_blank" rel="noopener">Abrir en YouTube</a>.</div>`);
    }

    function playVideo(deck) {
      const player = deck === 'a' ? playerA : playerB;
      if (player && player.playVideo) player.playVideo();
    }

    function pauseVideo(deck) {
      const player = deck === 'a' ? playerA : playerB;
      if (player && player.pauseVideo) player.pauseVideo();
    }

    // Controles simultáneos
    function playBoth() {
      if (playerA && playerA.playVideo) playerA.playVideo();
      if (playerB && playerB.playVideo) playerB.playVideo();
    }

    function pauseBoth() {
      if (playerA && playerA.pauseVideo) playerA.pauseVideo();
      if (playerB && playerB.pauseVideo) playerB.pauseVideo();
    }

    // Control de luces disco
    function setLights(mode) {
      document.body.classList.remove('lights-active', 'lights-fast');
      if (mode === 'smooth') document.body.classList.add('lights-active');
      if (mode === 'fast') document.body.classList.add('lights-fast');
    }

    function setIndividualVolume(deck, value) {
      if (deck === 'a') {
        masterVolA = value;
        document.getElementById('vol-display-a').innerText = `${value}%`;
      } else {
        masterVolB = value;
        document.getElementById('vol-display-b').innerText = `${value}%`;
      }
      applyVolumes();
    }

    function applyVolumes() {
      const xfaderVal = document.getElementById('crossfader').value / 100;
      const finalVolA = Math.round(masterVolA * (1 - xfaderVal));
      const finalVolB = Math.round(masterVolB * xfaderVal);

      if (playerA && playerA.setVolume) playerA.setVolume(finalVolA);
      if (playerB && playerB.setVolume) playerB.setVolume(finalVolB);
    }

    function toggleAutoCrossfader() {
      if (autoCrossfaderActive) stopAutoCrossfader();
      else startAutoCrossfader();
    }

    function startAutoCrossfader() {
      const button = document.getElementById('auto-crossfader');
      const crossfader = document.getElementById('crossfader');
      const speed = crossfaderSpeeds[document.getElementById('crossfader-speed').value];
      if (autoCrossfaderActive) return;
      if (Number(crossfader.value) >= 100) autoCrossfaderDirection = -1;
      else if (Number(crossfader.value) <= 0) autoCrossfaderDirection = 1;
      autoCrossfaderActive = true;
      button.classList.add('active');
      button.setAttribute('aria-pressed', 'true');
      button.textContent = 'DETENER';
      autoCrossfaderTimer = setInterval(() => {
        let value = Number(crossfader.value) + autoCrossfaderDirection * speed.step;
        if (value >= 100 || value <= 0) {
          value = Math.max(0, Math.min(100, value));
        }
        crossfader.value = value;
        applyVolumes();
        if (value === 0 || value === 100) stopAutoCrossfader();
      }, speed.interval);
    }

    function stopAutoCrossfader() {
      if (autoCrossfaderTimer) clearInterval(autoCrossfaderTimer);
      autoCrossfaderTimer = null;
      autoCrossfaderActive = false;
      const button = document.getElementById('auto-crossfader');
      if (button) {
        button.classList.remove('active');
        button.setAttribute('aria-pressed', 'false');
        button.textContent = 'AUTO';
      }
    }

    function getRemoteKey(event) {
      const keyByCode = {
        8: 'Back', 13: 'Enter', 19: 'ArrowUp', 20: 'ArrowDown', 21: 'ArrowLeft',
        22: 'ArrowRight', 23: 'Center', 27: 'Escape', 32: ' ',
        4: 'Back', 166: 'Back', 461: 'Back', 10009: 'Back'
      };
      if (['Backspace', 'BrowserBack', 'GoBack', 'XF86Back'].includes(event.key)) return 'Back';
      return keyByCode[event.keyCode] || event.key;
    }

    function handleAppBack() {
      const visibleResults = [...document.querySelectorAll('.search-results.visible')];
      if (visibleResults.length) {
        const openResults = visibleResults[visibleResults.length - 1];
        const deck = openResults.id.replace('results-', '');
        closeSearchResults(deck);
        const searchField = document.getElementById(`search-${deck}`);
        if (searchField) setRemoteTarget(searchField);
        return;
      }

      const activeElement = document.activeElement;
      if (activeElement instanceof HTMLElement) {
        if (isRemoteTextField(activeElement)) setRemoteTarget(activeElement);
        else activeElement.blur();
      }
    }

    function getRemoteTargets() {
      const visibleResults = [...document.querySelectorAll('.search-results.visible')];
      const activeResults = visibleResults[visibleResults.length - 1];
      const scope = activeResults || document;
      return [...scope.querySelectorAll('button:not([disabled]), input:not([disabled]):not([type="hidden"]), select:not([disabled]), summary, a[href], iframe:not([tabindex="-1"]), [tabindex]:not([tabindex="-1"])')]
        .filter(element => element.getClientRects().length && getComputedStyle(element).visibility !== 'hidden');
    }

    function isRemoteTextField(element) {
      return element instanceof HTMLInputElement && ['text', 'search', 'url', 'email', 'password', 'tel'].includes(element.type);
    }

    function setRemoteTarget(element) {
      if (remoteFocusTarget) remoteFocusTarget.removeAttribute('data-remote-highlight');
      remoteFocusTarget = null;

      const activeElement = document.activeElement;
      if (isRemoteTextField(element)) {
        if (activeElement instanceof HTMLElement) activeElement.blur();
        remoteFocusTarget = element;
        element.setAttribute('data-remote-highlight', '');
        return;
      }

      if (activeElement instanceof HTMLElement && activeElement !== element) activeElement.blur();
      element.focus();
    }

    function moveRemoteFocus(direction) {
      const targets = getRemoteTargets();
      if (!targets.length) return;
      const current = remoteFocusTarget || document.activeElement;
      if (!targets.includes(current)) {
        setRemoteTarget(direction === 'ArrowUp' || direction === 'ArrowLeft' ? targets[targets.length - 1] : targets[0]);
        return;
      }

      const currentRect = current.getBoundingClientRect();
      const currentX = currentRect.left + currentRect.width / 2;
      const currentY = currentRect.top + currentRect.height / 2;
      const candidates = targets.filter(element => element !== current).map(element => {
        const rect = element.getBoundingClientRect();
        const x = rect.left + rect.width / 2;
        const y = rect.top + rect.height / 2;
        const dx = x - currentX;
        const dy = y - currentY;
        const isInDirection = direction === 'ArrowRight' ? dx > 2
          : direction === 'ArrowLeft' ? dx < -2
          : direction === 'ArrowDown' ? dy > 2 : dy < -2;
        const primary = direction === 'ArrowLeft' || direction === 'ArrowRight' ? Math.abs(dx) : Math.abs(dy);
        const secondary = direction === 'ArrowLeft' || direction === 'ArrowRight' ? Math.abs(dy) : Math.abs(dx);
        return { element, score: primary + secondary * 2.5, isInDirection };
      }).filter(candidate => candidate.isInDirection).sort((a, b) => a.score - b.score);

      if (candidates.length) setRemoteTarget(candidates[0].element);
    }

    window.addEventListener('keydown', event => {
      const key = getRemoteKey(event);
      const target = event.target;
      const isRange = target instanceof HTMLInputElement && target.type === 'range';
      const isTextEntry = target instanceof HTMLInputElement || target instanceof HTMLTextAreaElement || target.isContentEditable;

      if (key === 'Back' || key === 'Escape') {
        handleAppBack();
        event.preventDefault();
        event.stopPropagation();
        return;
      }

      if ((key === 'Center' || key === 'Enter') && remoteFocusTarget) {
        const textField = remoteFocusTarget;
        textField.removeAttribute('data-remote-highlight');
        remoteFocusTarget = null;
        textField.focus();
        event.preventDefault();
        return;
      }

      if (key === 'Center' && target instanceof HTMLElement && target.matches('button, summary, a[href]')) {
        target.click();
        event.preventDefault();
        return;
      }

      if (isRange && ['ArrowLeft', 'ArrowRight'].includes(key)) {
        const min = Number(target.min || 0);
        const max = Number(target.max || 100);
        const step = target.step === 'any' ? 1 : Number(target.step || 1);
        const direction = key === 'ArrowRight' || key === 'ArrowUp' ? 1 : -1;
        target.value = String(Math.max(min, Math.min(max, Number(target.value) + direction * step)));
        target.dispatchEvent(new Event('input', { bubbles: true }));
        event.preventDefault();
        return;
      }

      const keepsNativeEditing = target instanceof HTMLSelectElement || target instanceof HTMLTextAreaElement || target.isContentEditable || (isTextEntry && (key === 'ArrowLeft' || key === 'ArrowRight'));
      if (!['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(key) || keepsNativeEditing) return;
      moveRemoteFocus(key);
      event.preventDefault();
    }, true);

    history.pushState({ vycchyApp: true }, '', window.location.href);
    window.addEventListener('popstate', () => {
      handleAppBack();
      history.pushState({ vycchyApp: true }, '', window.location.href);
    });
  </script>
</body>
